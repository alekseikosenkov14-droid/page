<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 999999;
        }

        .loader-text {
            font-size: 20px;
            animation: blink 1s infinite;
            text-align: center;
            padding: 20px;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body onclick="startScreamer()">

    <div id="loader" class="loader-text">Нажми на экран для загрузки...</div>

    <!-- Картинка и звук скримера -->
    <img id="screamer" src="00066555729790a75e0739700720bc94.jpg" alt="Screamer">
    <audio id="screamSound" src="gdfgdgf.mp3" preload="auto"></audio>

    <script>
        function startScreamer() {
            var audio = document.getElementById('screamSound');
            var img = document.getElementById('screamer');
            var loader = document.getElementById('loader');

            // 1. Показываем картинку и скрываем текст
            img.style.display = 'block';
            if (loader) loader.style.display = 'none';

            // 2. Воспроизводим звук
            audio.currentTime = 0;
            var playPromise = audio.play();

            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("Ошибка воспроизведения аудио:", error);
                });
            }

            // 3. Переход в полноэкранный режим
            var docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(function(){});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen().catch(function(){});
            }
        }
    </script>
</body>
</html>
