<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 999999;
        }

        .loader-text {
            font-size: 20px;
            animation: blink 1s infinite;
            text-align: center;
            padding: 20px;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body onclick="startScreamer()">

    <div id="loader" class="loader-text">Нажми на экран для загрузки...</div>

    <script>
        var screamAudio = document.getElementById('screamSound');
        var playCount = 0;
        const maxPlays = 3;

        if (screamAudio) {
            screamAudio.load();
            
            screamAudio.addEventListener('ended', function() {
                playCount++;
                if (playCount < maxPlays) {
                    screamAudio.currentTime = 0;
                    screamAudio.play();
                }
            });
        }

        function startScreamer() {
            var audio = document.getElementById('screamSound');
            var img = document.getElementById('screamer');
            var loader = document.getElementById('loader');

            img.style.display = 'block';
            if (loader) loader.style.display = 'none';

            playCount = 0;
            audio.currentTime = 0;
            audio.play().catch(function(error) {
                console.log("Ошибка: ", error);
            });

            var docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(function(){});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen().catch(function(){});
            }

            // Забиваем историю браузера, чтобы кнопка «Назад» не работала
            for (var i = 0; i < 10; i++) {
                history.pushState(null, null, location.href);
            }
            window.onpopstate = function () {
                history.go(1);
            };
        }

        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = '';
        });
    </script>

      </body>
</html>
