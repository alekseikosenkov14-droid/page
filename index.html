<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
        }

        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 9999;
        }

        .loader-text {
            font-size: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body onclick="startScreamer()">

    <div class="loader-text">Нажми на экран для загрузки...</div>

    <!-- Картинка и звук скримера -->
    <img id="screamer" src="00066555729790a75e0739700720bc94.jpg" style="display:none; width:100%; height:100%; object-fit:cover;">
    <audio id="screamSound" src="gdfgdgf.mp3" preload="auto"></audio>

        <script>
        function startScreamer() {
            document.getElementById('screamSound').play();
            document.getElementById('screamer').style.display = 'block';

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }
        </script>
</body>

</html>
