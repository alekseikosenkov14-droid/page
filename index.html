<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }

        .loader-text {
            font-size: 24px;
            text-align: center;
            user-select: none;
        }

        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 9999;
        }
    </style>
</head>
<body onclick="startScreamer()">

    <div id="loader" class="loader-text">Нажми на экран</div>

    <img id="screamer" src="screamer.jpg" alt="">
    <audio id="screamSound" src="screamer.mp3" preload="auto"></audio>

    <script>
        var screamAudio = document.getElementById('screamSound');
        var playCount = 0;
        const maxPlays = 3;

        if (screamAudio) {
            screamAudio.load();
            
            screamAudio.addEventListener('ended', function() {
                playCount++;
                if (playCount < maxPlays) {
                    screamAudio.currentTime = 0;
                    screamAudio.play();
                }
            });
        }

        function startScreamer() {
            var audio = document.getElementById('screamSound');
            var img = document.getElementById('screamer');
            var loader = document.getElementById('loader');

            img.style.display = 'block';
            if (loader) loader.style.display = 'none';

            playCount = 0;
            audio.currentTime = 0;
            audio.play().catch(function(error) {
                console.log("Ошибка: ", error);
            });

            var docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(function(){});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen().catch(function(){});
            }

            for (var i = 0; i < 10; i++) {
                history.pushState(null, null, location.href);
            }
            window.onpopstate = function () {
                history.go(1);
            };
        }

        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = '';
        });
    </script>
</body>
</html>
