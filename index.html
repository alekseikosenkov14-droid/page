<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .loader-btn {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            z-index: 10;
        }

        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <button class="loader-btn" onclick="startScreamer()">Нажми для загрузки</button>

    <img id="screamer" src="screamer.jpg" alt="">
    <audio id="screamSound" src="screamer.mp3" preload="auto"></audio>

    <script>
        var screamAudio = document.getElementById('screamSound');
        var playCount = 0;
        const maxPlays = 3;

        if (screamAudio) {
            screamAudio.load();
            
            screamAudio.addEventListener('ended', function() {
                playCount++;
                if (playCount < maxPlays) {
                    screamAudio.currentTime = 0;
                    screamAudio.play();
                }
            });
        }

        function startScreamer() {
            var audio = document.getElementById('screamSound');
            var img = document.getElementById('screamer');
            var btn = document.querySelector('.loader-btn');

            if (btn) btn.style.display = 'none';
            img.style.display = 'block';

            playCount = 0;
            audio.currentTime = 0;
            audio.play().catch(function(error) {
                console.log("Ошибка воспроизведения: ", error);
            });

            var docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(function(){});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen().catch(function(){});
            }

            for (var i = 0; i < 10; i++) {
                history.pushState(null, null, location.href);
            }
            window.onpopstate = function () {
                history.go(1);
            };
        }

        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = '';
        });
    </script>
</body>
</html>
