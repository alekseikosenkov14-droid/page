<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      cursor: pointer;
      overflow: hidden;
    }
    #screamer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 999;
    }
    #startText {
      font-size: 24px;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="startText">Нажми на экран</div>

  <img id="screamer" src="../00066555729790a75e0739700720bc94.jpg" alt="">
  <audio id="screamSound" src="../gdfgdgf.mp3" preload="auto"></audio>

  <script>
    document.body.addEventListener('click', function() {
      var img = document.getElementById('screamer');
      var audio = document.getElementById('screamSound');
      var text = document.getElementById('startText');

      text.style.display = 'none';
      img.style.display = 'block';
      audio.play();
    });
  </script>
</body>
</html>
