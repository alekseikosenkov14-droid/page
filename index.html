<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 999999;
        }

        .loader-text {
            font-size: 20px;
            animation: blink 1s infinite;
            text-align: center;
            padding: 20px;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body onclick="startScreamer()">

    <div id="loader" class="loader-text">Нажми на экран для загрузки...</div>

        <script>
        // Предзагрузка звука в память сразу при открытии страницы
        var screamAudio = document.getElementById('screamSound');
        if (screamAudio) {
            screamAudio.load();
        }

        function startScreamer() {
            var audio = document.getElementById('screamSound');
            
            // Сбрасываем звук на самое начало и сразу воспроизводим
            audio.currentTime = 0;
            audio.play().catch(function(error) {
                console.log("Ошибка: ", error);
            });

            // Включаем картинку одновременно со звуком
            document.getElementById('screamer').style.display = 'block';

            // Полноэкранный режим
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }
    </script>
      </body>
</html>
